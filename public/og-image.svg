<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1A1211" />
    </linearGradient>

    <!-- Warm Glow Filter -->
    <radialGradient id="saffronGlow" cx="25%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#E06D28" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#E06D28" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Linear Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E06D28" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#saffronGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Geometric Decorative Contour / Network Lines -->
  <g opacity="0.3" stroke="#E06D28" stroke-width="1.2" fill="none">
    <path d="M 750 120 C 820 180, 890 140, 960 210 C 1030 280, 1080 230, 1140 310" stroke-dasharray="4 4" />
    <path d="M 720 220 C 800 280, 870 230, 940 340 C 1010 430, 1070 380, 1130 460" stroke-opacity="0.6" />
    <path d="M 780 340 C 840 400, 920 370, 980 470 C 1040 550, 1100 500, 1150 560" stroke-dasharray="6 4" stroke-opacity="0.4" />
  </g>

  <!-- Constellation Nodes & Waveform in right quadrant -->
  <g transform="translate(740, 160)">
    <!-- Simulated Map / Microcluster Nodes -->
    <circle cx="160" cy="110" r="48" fill="#E06D28" fill-opacity="0.12" stroke="#E06D28" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="160" cy="110" r="18" fill="#E06D28" fill-opacity="0.3"/>
    <circle cx="160" cy="110" r="7" fill="#E06D28"/>

    <circle cx="280" cy="70" r="32" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1"/>
    <circle cx="280" cy="70" r="5" fill="#34D399"/>

    <circle cx="260" cy="220" r="38" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="260" cy="220" r="6" fill="#FBBF24"/>

    <circle cx="100" cy="260" r="28" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="100" cy="260" r="5" fill="#60A5FA"/>

    <!-- Connector Edges -->
    <line x1="160" y1="110" x2="280" y2="70" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="160" y1="110" x2="260" y2="220" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="160" y1="110" x2="100" y2="260" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="280" y1="70" x2="260" y2="220" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Data Callout Card Floating -->
    <rect x="180" y="130" width="180" height="74" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="195" y="152" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">HOTSPOT #W-08</text>
    <text x="195" y="172" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Nadia Basin, WB</text>
    <text x="195" y="190" fill="#E06D28" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gap Score: 74/100 · Critical</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 80)">
    <!-- Top Pill / Status Tag -->
    <g>
      <rect width="364" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#10B981" />
      <text x="32" y="22" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.4">
        CIVIC INTELLIGENCE PLATFORM · INDIA
      </text>
    </g>

    <!-- Main Brandmark & Title -->
    <g transform="translate(0, 70)">
      <!-- Brand Icon Motif -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#1E293B" stroke="#E06D28" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="16" stroke="#E06D28" stroke-width="2" stroke-dasharray="3 2" opacity="0.6"/>
        <circle cx="26" cy="26" r="10" stroke="#E06D28" stroke-width="2" opacity="0.9"/>
        <circle cx="26" cy="26" r="4.5" fill="#E06D28"/>
      </g>

      <text x="68" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
        Baat2Badlav
      </text>

      <!-- Tagline -->
      <text x="0" y="105" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        From Citizen Voices to Development Intelligence
      </text>

      <!-- Subtitle Description -->
      <text x="0" y="152" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" line-height="28">
        Synthesizing multilingual citizen demand, spatial GIS baselines, and demographic
      </text>
      <text x="0" y="180" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
        exposure into actionable, simulation-backed public infrastructure evidence.
      </text>
    </g>

    <!-- 4 Bottom Capabilities Badges -->
    <g transform="translate(0, 340)">
      <!-- Badge 1 -->
      <g>
        <rect width="140" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="23" fill="#E06D28" font-family="system-ui, sans-serif" font-size="11" font-weight="700">12 INDIC</text>
        <text x="16" y="40" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Languages</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="165" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="23" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GEMINI CIVIC</text>
        <text x="16" y="40" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Entity Normalization</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(335, 0)">
        <rect width="160" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="23" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GIS &amp; BASELINES</text>
        <text x="16" y="40" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PMGSY · Bhuvan</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(510, 0)">
        <rect width="165" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="23" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SIMULATION</text>
        <text x="16" y="40" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gap Score Modeling</text>
      </g>
    </g>

    <!-- Bottom Line Meta -->
    <g transform="translate(0, 435)">
      <text x="0" y="0" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">
        HUMAN DECISION SUPREMACY · ZERO PII RETENTION · REPRODUCIBLE CDGI EVIDENCE
      </text>
    </g>
  </g>

  <!-- Outer Border Accent -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#E06D28" stroke-width="2" stroke-opacity="0.3"/>
</svg>
